    <path d="M366 348L444 348L430 688L350 688Z" fill="#07131a"/>
    <path d="M366 348L612 348L590 424L366 424Z" fill="#07131a"/>
    <path d="M366 500L520 500L502 570L366 570Z" fill="#07131a"/>

    <path d="M444 348L430 688" fill="none" stroke="url(#silverEdge)" stroke-width="8" stroke-linecap="round"/>
    <path d="M612 348L590 424" fill="none" stroke="url(#silverEdge)" stroke-width="8" stroke-linecap="round"/>
    <path d="M520 500L502 570" fill="none" stroke="url(#silverEdge)" stroke-width="7" stroke-linecap="round"/>

    <path d="M418 234L722 346" fill="none" stroke="rgba(243,251,255,0.18)" stroke-width="8" stroke-linecap="round"/>
    <path d="M722 346L648 704" fill="none" stroke="rgba(243,251,255,0.12)" stroke-width="6" stroke-linecap="round"/>

    <circle cx="722" cy="346" r="22" fill="url(#amberPulse)"/>
    <circle cx="722" cy="346" r="50" fill="none" stroke="rgba(246,192,124,0.22)" stroke-width="10"/>
